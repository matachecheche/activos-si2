spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/activos_fijos_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:password1234}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

server.port=${PORT:8080}

# Sprint 1 - HU-01: JWT
app.jwt.secret=${APP_JWT_SECRET:CambiarEstaClaveSecretaPorUnaSeguraDeAlMenos256Bits123456}
app.jwt.expiration-ms=${APP_JWT_EXPIRATION_MS:1800000}
app.jwt.max-intentos-fallidos=3
app.jwt.segundos-bloqueo=30

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/activos_fijos_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:password1234}

# Credenciales de las pasarelas de pago guardadas por configurar_pasarelas.py.
# El archivo "pasarelas.env" (KEY=VALUE) se carga solo si existe: asi, al
# probar en local, el backend usa las mismas claves que pusiste en Azure.
# Se buscan en la carpeta del backend y en la carpeta del proyecto (un nivel arriba).
spring.config.import=optional:file:pasarelas.env[.properties],optional:file:../pasarelas.env[.properties]

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

server.port=${PORT:8080}

# Sprint 1 - HU-01: JWT
app.jwt.secret=${APP_JWT_SECRET:CambiarEstaClaveSecretaPorUnaSeguraDeAlMenos256Bits123456}
app.jwt.expiration-ms=${APP_JWT_EXPIRATION_MS:1800000}
app.jwt.max-intentos-fallidos=${APP_JWT_MAX_INTENTOS:5}
app.jwt.segundos-bloqueo=${APP_JWT_SEGUNDOS_BLOQUEO:900}

# Sprint 2 - HU-07: depreciacion
# Proceso programado mensual (segundos minutos horas dia-mes mes dia-semana): dia 1 de cada mes a las 02:00
app.depreciacion.cron=${APP_DEPRECIACION_CRON:0 0 2 1 * *}
# Al arrancar recupera los periodos pendientes (idempotente: no duplica registros)
app.depreciacion.calcular-al-iniciar=${APP_DEPRECIACION_AL_INICIAR:true}

# ===== Sprint 3 =====
# HU-13: bitacora inmutable (archivo adicional append-only)
app.auditoria.archivo=${APP_AUDITORIA_ARCHIVO:logs/auditoria_sp3.log}
# HU-14: IA de consulta en lenguaje natural. Sin claves opera en modo guiado.
# Ademas de las variables de entorno, el backend lee ia_config.json (configurar_ia.bat).
app.ia.config-file=${APP_IA_CONFIG_FILE:}
app.ia.groq-api-key=${GROQ_API_KEY:}
app.ia.groq-modelo=${GROQ_MODEL:openai/gpt-oss-120b}
app.ia.gemini-api-key=${GEMINI_API_KEY:}
app.ia.gemini-modelo=${GEMINI_MODEL:gemini-3.8-flash}
app.ia.max-filas=${APP_IA_MAX_FILAS:100}
# HU-16: respaldos
app.respaldos.carpeta=${APP_RESPALDOS_CARPETA:respaldos}
app.respaldos.carpeta-nube=${APP_RESPALDOS_NUBE:}
# HU-15: personalizacion
app.marca.logo-max-bytes=${APP_LOGO_MAX:1048576}
# HU-17: fotos de verificacion de inventario
app.archivos.carpeta=${APP_ARCHIVOS_CARPETA:uploads}
# HU-12: credenciales iniciales del Super Admin de plataforma (cambiar en produccion)
app.superadmin.correo=${APP_SUPERADMIN_CORREO:superadmin@plataforma.local}
app.superadmin.password=${APP_SUPERADMIN_PASSWORD:Cambiar123!}

# ===== Sprint 3 / pasarela de pagos REAL (no simulada) =====
# Proveedor: MERCADO_PAGO | PAYPAL | STRIPE | QR
app.pagos.proveedor=${APP_PAGOS_PROVEEDOR:MERCADO_PAGO}
# Mercado Pago (Checkout Pro). El token se obtiene en
# https://www.mercadopago.com.bo/developers/panel/app
app.pagos.mercadopago.access-token=${MERCADOPAGO_ACCESS_TOKEN:}
app.pagos.mercadopago.webhook-secret=${MERCADOPAGO_WEBHOOK_SECRET:}
# PayPal (Orders v2). Credenciales en https://developer.paypal.com/dashboard/applications
app.pagos.paypal.client-id=${PAYPAL_CLIENT_ID:}
app.pagos.paypal.client-secret=${PAYPAL_CLIENT_SECRET:}
app.pagos.paypal.ambiente=${PAYPAL_AMBIENTE:live}
# Stripe (Checkout Sessions). Claves en https://dashboard.stripe.com/apikeys
# (sk_test_... / sk_live_...) y el secreto del webhook (whsec_...) en la
# seccion "Webhooks" del panel. Stripe no admite bolivianos: se cobra en USD
# (o la moneda que se indique) y se aplica el factor de conversion.
app.pagos.stripe.secret-key=${STRIPE_SECRET_KEY:}
app.pagos.stripe.webhook-secret=${STRIPE_WEBHOOK_SECRET:}
app.pagos.stripe.moneda=${STRIPE_MONEDA:USD}
app.pagos.stripe.base-url=${STRIPE_BASE_URL:https://api.stripe.com}
app.pagos.stripe.factor-conversion=${STRIPE_FACTOR_CONVERSION:}
# QR Simple (Red Enlace / ATC): el codigo QR oficial e interoperable del
# Banco Central de Bolivia. Credenciales las entrega ATC al integrador.
#   certificacion: https://atcgwapitest.redenlace.com.bo/sandbox
#   produccion:    https://api.redenlace.com.bo
app.pagos.qr.client-id=${APP_PAGOS_QR_CLIENT_ID:}
app.pagos.qr.client-secret=${APP_PAGOS_QR_CLIENT_SECRET:}
app.pagos.qr.base-url=${APP_PAGOS_QR_BASE_URL:https://atcgwapitest.redenlace.com.bo/sandbox}
app.pagos.qr.id-establecimiento=${APP_PAGOS_QR_ID_ESTABLECIMIENTO:0}
app.pagos.qr.nombre-establecimiento=${APP_PAGOS_QR_NOMBRE_ESTABLECIMIENTO:Activos Fijos}
app.pagos.qr.vigencia=${APP_PAGOS_QR_VIGENCIA:900}
# Cabecera con la que ATC firma el webhook del pago (clave y valor).
app.pagos.qr.webhook-key=${APP_PAGOS_QR_WEBHOOK_KEY:x-api-key}
app.pagos.qr.webhook-value=${APP_PAGOS_QR_WEBHOOK_VALUE:}
# Moneda en la que cobra la pasarela (BOB o USD) y factor de conversion
# desde bolivianos (por ejemplo 6.9 para pasar de Bs a USD).
app.pagos.moneda=${APP_PAGOS_MONEDA:BOB}
app.pagos.factor-conversion=${APP_PAGOS_FACTOR_CONVERSION:1}
# Modo demostracion: aprueba los pagos sin llamar a la pasarela.
# Solo para pruebas; en produccion debe ser false.
app.pagos.sandbox=${APP_PAGOS_SANDBOX:false}
# URL publica del backend (para las url de retorno y el webhook)
app.url-publica=${APP_URL_PUBLICA:http://localhost:8080}
